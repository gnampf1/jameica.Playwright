src.dir                         = src
lib.dir                         = lib

define.package                  = de.gnampf.playwright
define.java.version             = 17
define.encoding                 = ISO-8859-1

# Kotlin-Compiler-Version (muss zur aufgeloesten kotlin-stdlib passen); wird bei Bedarf
# einmalig heruntergeladen und in build/tools gecacht.
kotlin.version                  = 2.2.0
tools.dir                       = build/tools

# Signieren: dieselbe CA/Keystore wie SyncusGnampfus, damit Jameica dem Zertifikat
# bereits vertraut (keine neue Vertrauensstellung noetig).
define.jameica.dir              = ../jameica
define.compilepath              = ${define.jameica.dir}/bin/;\
                                  ${define.jameica.dir}/lib/de_willuhn_util/de_willuhn_util.jar
signjar.keystore                = ${basedir}/../SyncusGnampfus/syncusgnampfus.ca.keystore
signjar.storepass               = ${basedir}/../SyncusGnampfus/syncusgnampfus.ca.storepass
signjar.alias                   = cn=syncusgnampfus\ updates,o=gnampf,ou=gnampf.cyou,c=de_3650

# URLs, die beim Build in plugin.xml eingetragen werden (Download-URL + Homepage).
download.baseurl                = https://www.gnampf.cyou/hibiscus
